<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 — Access Denied | TARALEX GRUP</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --mist: #f3f4f0;
        --surface: #ffffff;
        --ink: #12213f;
        --ink-2: #1e335e;
        --ink-soft: #54607a;
        --gold: #c9982f;
        --gold-deep: #a87b22;
        --gold-soft: #f3e6c4;
        --line: #dde0d8;
        --shadow-lift:
          0 4px 10px rgba(18, 33, 63, 0.06),
          0 26px 50px -16px rgba(18, 33, 63, 0.22);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(
            600px 400px at 15% 15%,
            rgba(201, 152, 47, 0.12),
            transparent 70%
          ),
          radial-gradient(
            700px 500px at 90% 90%,
            rgba(30, 51, 94, 0.5),
            transparent 70%
          ),
          var(--mist);
        font-family: "Manrope", sans-serif;
        color: var(--ink);
      }
      .card {
        background: var(--surface);
        border-radius: 24px;
        padding: 56px 48px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow-lift);
        border: 1px solid var(--line);
      }
      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 32px;
      }
      .logo .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--gold);
      }
      .logo b {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .code {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 88px;
        line-height: 1;
        color: var(--ink);
        letter-spacing: -0.03em;
        margin-bottom: 8px;
        position: relative;
        display: inline-block;
      }
      .code::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -10px;
        transform: translateX(-50%);
        width: 52px;
        height: 4px;
        background: var(--gold);
        border-radius: 2px;
      }
      h1 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 22px;
        font-weight: 700;
        margin: 22px 0 12px;
        letter-spacing: -0.01em;
      }
      p {
        color: var(--ink-soft);
        font-size: 14.5px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 24px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        transition: all 0.2s;
      }
      .btn-primary {
        background: var(--ink);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--ink-2);
        transform: translateY(-1px);
      }
      .btn-ghost {
        background: var(--mist);
        color: var(--ink);
        border: 1.5px solid var(--line);
      }
      .btn-ghost:hover {
        border-color: var(--gold);
      }
      .code-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: "Space Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        color: var(--gold-deep);
        background: var(--gold-soft);
        padding: 6px 12px;
        border-radius: 100px;
        margin-bottom: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><span class="dot"></span><b>TARALEX GRUP</b></div>
      <div class="code-tag">HTTP 403</div>
      <div class="code">403</div>
      <h1>Access Denied</h1>
      <p>
        You do not have permission to view this page. If you believe you should
        have access, please contact the site administrator.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Back to Home</a>
        <a href="/contacts.html" class="btn btn-ghost">Contact Us</a>
      </div>
    </div>
  </body>
</html>
