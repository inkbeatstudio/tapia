worker_processes auto;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # ------------------------------------------------------------
  # Main public site — tepiagroup.pl
  # ------------------------------------------------------------
  server {
    listen 80;
    server_name tepiagroup.pl www.tepiagroup.pl;

    root /usr/share/nginx/html/site;
    index index.html;

    error_page 404 /error-pages/404.html;
    error_page 500 502 503 504 /error-pages/500.html;
    location /error-pages/ {
      alias /usr/share/nginx/html/error-pages/;
    }

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    location /api/ {
      proxy_pass http://api:4000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
      proxy_pass http://api:4000/uploads/;
      proxy_set_header Host $host;
    }

    # Uncomment once certbot has issued a certificate for this domain:
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/live/tepiagroup.pl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/live/tepiagroup.pl/privkey.pem;
  }

  # ------------------------------------------------------------
  # Admin panel — admin.tepiagroup.pl
  # ------------------------------------------------------------
  server {
    listen 80;
    server_name admin.tepiagroup.pl;

    root /usr/share/nginx/html/admin;
    index index.html;

    error_page 401 /error-pages/401.html;
    error_page 403 /error-pages/403.html;
    error_page 404 /error-pages/404.html;
    error_page 429 /error-pages/429.html;
    error_page 500 502 503 504 /error-pages/500.html;
    location /error-pages/ {
      alias /usr/share/nginx/html/error-pages/;
    }

    location / {
      try_files $uri $uri.html $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://api:4000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
      proxy_pass http://api:4000/uploads/;
      proxy_set_header Host $host;
    }

    # Uncomment once certbot has issued a certificate for this domain:
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/live/admin.tepiagroup.pl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/live/admin.tepiagroup.pl/privkey.pem;
  }
}
